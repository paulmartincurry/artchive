<blockquote>“In the lonely barton by yonder coomb<br>Our childhood used to know,”<br>I should go with him in the gloom,<br>Hoping it might be so.</blockquote>
<h1>The Oxen</h1>
<p class="label">Thomas Hardy · 1915</p>
<p class="note">The poem was first published in December 1915, in the London newspaper The Times.</p>
