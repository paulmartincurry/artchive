<h1>Sapere aude</h1>
<p class="label">Horace; Immanuel Kant · 20 BC; 1784</p>
<p class="note">Latin for dare to know. Horace used it in his first book of Letters around 20 BC. Immanuel Kant took it as the motto of the Enlightenment in his 1784 essay Answering the Question: What Is Enlightenment?</p>
