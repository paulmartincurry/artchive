  <style>
    :root {
      --bg: #0b0b0c;
      --bg-elevated: #131316;
      --bg-plate: #151413;
      --text: #eceae4;
      --text-muted: #9e9a92;
      --text-faint: #75716a;
      --border: rgba(255, 255, 255, 0.09);
      --border-rule: rgba(255, 255, 255, 0.17);
      --border-active: rgba(255, 255, 255, 0.48);
      --pill-active-bg: #eceae4;
      --pill-active-text: #0b0b0c;
      --backdrop: rgba(8, 8, 9, 0.96);
    }

    body.light-wall {
      --bg: #f6f4f0;
      --bg-elevated: #ece9e2;
      --bg-plate: #efeae0;
      --text: #161514;
      --text-muted: #5c5953;
      --text-faint: #7e7a72;
      --border: rgba(0, 0, 0, 0.09);
      --border-rule: rgba(0, 0, 0, 0.18);
      --border-active: rgba(0, 0, 0, 0.52);
      --pill-active-bg: #161514;
      --pill-active-text: #f6f4f0;
      --backdrop: rgba(246, 244, 240, 0.97);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    /* Whisper-quiet sticky top navigation */
    button:focus:not(:focus-visible),
    select:focus:not(:focus-visible),
    a:focus:not(:focus-visible),
    input:focus:not(:focus-visible) {
      outline: none;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 1px solid var(--border-active);
      outline-offset: 4px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 26px 48px 22px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .nav-primary,
    .spatial-views-row,
    .secondary-drawer {
      max-width: 1744px;
      margin-left: auto;
      margin-right: auto;
    }

    .nav-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      flex-wrap: wrap;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .brand-count {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Primary Entry Switcher: All · Art · Pocket Poets */
    .mode-switcher {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
    }

    /* Minimal filter streams */
    .filter-streams {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: center;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
    }

    .group-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      margin-right: 5px;
      user-select: none;
    }

    .divider-dot {
      color: var(--text-faint);
      font-size: 0.75rem;
      user-select: none;
    }

    button.pill {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.77rem;
      font-weight: 400;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    button.pill:hover {
      color: var(--text);
    }

    button.pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      font-weight: 500;
    }

    /* Right-hand utility links */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    button.text-action {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 4px 2px;
      transition: color 0.15s ease;
      white-space: nowrap;
    }

    button.text-action:hover,
    button.text-action.active {
      color: var(--text);
    }

    button.text-action.active {
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    /* Collapsible secondary drawer — hidden unless needed */
    .secondary-drawer {
      display: none;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px solid var(--border);
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .secondary-drawer.open {
      display: flex;
    }

    /* Whisper-Quiet Cross-Century Timeline Scrubber Drawer (collapsed by default) */
    .timeline-drawer {
      display: none;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 10px;
    }

    .timeline-drawer.open {
      display: flex;
    }

    .timeline-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .timeline-slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 260px;
    }

    .timeline-scrubber-input {
      flex: 1;
      accent-color: var(--text);
      cursor: pointer;
      height: 3px;
    }

    .timeline-readout-label {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.08rem;
      font-weight: 500;
      min-width: 148px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .timeline-sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .timeline-region-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Original-Script Bilingual Specimen inside Open Chapbook (hidden until toggled) */
    .chapbook-orig-script {
      display: none;
      margin: 0 0 22px;
      padding: 16px 18px;
      border-left: 2px solid var(--border-active);
      background: rgba(255, 255, 255, 0.025);
      font-family: 'Cormorant Garamond', 'Noto Serif KR', 'Noto Serif JP', 'Noto Serif SC', 'Noto Naskh Arabic', Georgia, serif;
      font-size: 1.24rem;
      line-height: 1.75;
      white-space: pre-line;
      color: var(--text);
    }

    body.light-wall .chapbook-orig-script {
      background: rgba(0, 0, 0, 0.03);
    }

    .chapbook-orig-script.visible {
      display: block;
    }

    .chapbook-script-label {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 6px;
    }

    .drawer-selects {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .masters-quick-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .minimal-select {
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 4px 18px 4px 2px;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
    }

    .minimal-select:focus,
    .minimal-select:hover {
      color: var(--text);
      border-bottom-color: var(--border-active);
    }

    .minimal-select option {
      background: var(--bg-elevated);
      color: var(--text);
    }

    .color-filter-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tone-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tone-dot:hover {
      transform: scale(1.2);
    }

    .tone-dot.active {
      transform: scale(1.25);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--text);
    }

    .minimal-search {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 4px 2px;
      width: 210px;
      outline: none;
    }

    .minimal-search::placeholder {
      color: var(--text-faint);
    }

    .minimal-search:focus {
      border-bottom-color: var(--border-active);
    }

    /* Saved View Utility Bar (only visible when viewing Saved stash) */
    .saved-kit-bar {
      display: none;
      max-width: 1840px;
      margin: 0 auto;
      padding: 18px 32px 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .saved-kit-bar.visible {
      display: flex;
    }

    .saved-kit-info {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .saved-kit-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stack-bar-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 10px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }

    .stack-pills-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .inline-stack-form {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .inline-stack-form.open {
      display: inline-flex;
    }

    .inline-stack-input {
      background: var(--bg-elevated);
      border: 1px solid var(--border-active);
      color: var(--text);
      font-family: inherit;
      font-size: 0.74rem;
      padding: 3px 9px;
      border-radius: 999px;
      width: 145px;
      outline: none;
    }

    .active-pigment-chip {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-active);
      background: var(--bg-elevated);
      color: var(--text);
      font-family: inherit;
      font-size: 0.73rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .active-pigment-chip.visible {
      display: inline-flex;
    }

    .pigment-chip-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      display: inline-block;
    }

    .rabbit-holes-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .active-trail-banner {
      display: none;
      max-width: 1840px;
      margin: 0 auto;
      padding: 18px 32px 0;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .active-trail-banner.visible {
      display: flex;
    }

    .trail-banner-copy {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .trail-banner-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text);
    }

    .trail-banner-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .craft-pivots-wrap {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 6px;
    }

    .craft-pivot-chip {
      background: var(--bg);
      border: 1px solid var(--border-active);
      color: var(--text);
      font-family: inherit;
      font-size: 0.69rem;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .craft-pivot-chip:hover {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    .lb-studio-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 9px 0 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .lb-palette-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .lb-palette-row .lb-palette {
      margin-bottom: 0;
    }

    .stage-image-wrap.eyedropper-mode,
    .stage-image-wrap.eyedropper-mode img {
      cursor: crosshair !important;
    }

    /* Side-by-Side Diptych Collision Modal */
    .diptych-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 95;
      background: var(--backdrop);
      overflow-y: auto;
      padding: 28px 24px 48px;
    }

    .diptych-modal.open {
      display: block;
    }

    .diptych-shell {
      max-width: 1520px;
      margin: 0 auto;
    }

    .diptych-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .diptych-title-cluster {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .diptych-heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .diptych-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .diptych-Stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      padding: 28px;
      background: #111113;
      border: 1px solid var(--border);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .diptych-Stage.cream-mat {
      background: #f2ede3;
      color: #181715;
      border-color: rgba(0,0,0,0.12);
    }

    @media (max-width: 820px) {
      .diptych-Stage {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }

    .diptych-slot {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .diptych-visual-box {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255,255,255,0.09);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .diptych-Stage.cream-mat .diptych-visual-box {
      background: #e6dfd2;
      border-color: rgba(0,0,0,0.1);
    }

    .diptych-visual-box img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .diptych-poet-sheet {
      width: 100%;
      height: 100%;
      padding: 34px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .diptych-slot-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .diptych-slot-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 500;
    }

    .diptych-slot-artist {
      font-size: 0.75rem;
      opacity: 0.72;
    }

    .diptych-collision-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Main Gallery Wall — True Stable Flex Columns */
    main {
      padding: 24px 48px 108px;
      max-width: 1840px;
      margin: 0 auto;
    }

    .gallery-grid {
      display: flex;
      align-items: flex-start;
      gap: 38px;
      width: 100%;
    }

    .gallery-grid.density-large {
      gap: 56px;
      max-width: 1480px;
      margin: 0 auto;
    }

    .gallery-grid.pv-mason { position: relative; }
    .gallery-grid.pv-mason:not([style*="none"]) { display: block !important; }
    .gallery-grid.pv-mason > .art-piece { position: absolute !important; margin: 0; }
    .masonry-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    @media (max-width: 900px) {
      .gallery-grid { gap: 22px; }
      header { padding: 18px 20px 16px; }
      main { padding: 20px 20px 72px; }
    }

    .art-piece {
      width: 100%;
      cursor: zoom-in;
    }

    .art-frame {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--bg-elevated);
    }

    .art-frame img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .art-piece:hover .art-frame img {
      transform: scale(1.015);
    }

    /* 3:4 City Lights / Everyman Pocket Poets Chapbook Cover on the Wall */
    .pocket-poet-cover {
      aspect-ratio: 3 / 4;
      width: 100%;
      background: var(--bg-plate);
      border: 1px solid var(--border);
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
    }

    .pocket-poet-cover[data-mood="Fury"] { background: linear-gradient(160deg, rgba(140, 38, 28, 0.14), var(--bg-plate) 65%); }
    .pocket-poet-cover[data-mood="Dread"] { background: linear-gradient(160deg, rgba(35, 39, 48, 0.28), var(--bg-plate) 65%); }
    .pocket-poet-cover[data-mood="Sublime"] { background: linear-gradient(160deg, rgba(180, 140, 50, 0.13), var(--bg-plate) 65%); }
    .pocket-poet-cover[data-mood="Melancholy"] { background: linear-gradient(160deg, rgba(45, 72, 95, 0.18), var(--bg-plate) 65%); }
    .pocket-poet-cover[data-mood="Dark Humor"] { background: linear-gradient(160deg, rgba(143, 71, 46, 0.14), var(--bg-plate) 65%); }
    .pocket-poet-cover[data-mood="Resolve"] { background: linear-gradient(160deg, rgba(115, 110, 101, 0.14), var(--bg-plate) 65%); }
    .pocket-poet-cover[data-mood="Yearning"] { background: linear-gradient(160deg, rgba(168, 68, 88, 0.18), var(--bg-plate) 65%); }

    .art-piece:hover .pocket-poet-cover {
      transform: translateY(-3px);
      border-color: var(--border-active);
    }

    .pocket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-rule);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .pocket-hook {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.56rem;
      font-style: italic;
      font-weight: 400;
      line-height: 1.34;
      color: var(--text);
      white-space: pre-line;
      margin: auto 0;
      padding: 12px 0;
    }

    .gallery-grid.density-large .pocket-hook {
      font-size: 2.05rem;
    }

    .pocket-footer {
      padding-top: 12px;
      border-top: 1px solid var(--border-rule);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Detail 2x inspection mode */
    .gallery-grid.mode-detail .art-frame {
      aspect-ratio: 1 / 1;
    }

    .gallery-grid.mode-detail .art-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.85);
    }

    .gallery-grid.mode-detail .art-piece:hover .art-frame img {
      transform: scale(2.05);
    }

    /* Clean two-line museum placard underneath (zero truncation, hidden in Pure Wall mode) */
    .art-caption {
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .art-piece:hover .art-caption {
      opacity: 1;
    }

    .gallery-grid.pure-wall .art-caption {
      display: none;
    }

    .gallery-grid.pure-wall .masonry-col {
      gap: 32px;
    }

    .caption-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.06rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.28;
    }

    .caption-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.38;
      white-space: normal;
      overflow: visible;
      max-width: 100%;
    }

    /* Infinite scroll sentinel */
    .scroll-sentinel {
      height: 48px;
      width: 100%;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 120px 20px;
      color: var(--text-muted);
    }

    .empty-state p {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.4rem;
      margin-bottom: 14px;
    }

    /* Public.Work-inspired quiet Breadcrumb History Trail at bottom of screen */
    .history-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .history-dock.visible {
      display: flex;
    }

    .history-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-right: 2px;
      user-select: none;
    }

    .history-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .history-thumb:hover {
      transform: scale(1.18);
      border-color: var(--text);
    }

    .history-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lightbox — Pure Museum, Duotone Lab, Broadside Pairing & Open Chapbook Room */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .lightbox.open {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(290px, 38vw, 390px);
      opacity: 1;
    }

    @media (max-width: 520px) {
      .lightbox.open {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
    }

    .lightbox-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 28px;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }

    @media (max-width: 520px) {
      .lightbox-stage {
        height: auto;
        min-height: 54vh;
        padding: 20px 16px;
      }
    }

    .stage-image-wrap {
      position: relative;
      max-width: 100%;
      max-height: calc(100vh - 155px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: padding 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
    }

    .stage-image-wrap img {
      max-width: 100%;
      max-height: calc(100vh - 155px);
      width: auto;
      height: auto;
      object-fit: contain;
      transition: filter 0.25s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Broadside Mode (ECM / A24 Image + Atomic Verse Collision Specimen) */
    .stage-image-wrap.lens-broadside {
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg-plate);
      border: 1px solid var(--border-rule);
      padding: 28px 34px 24px;
      max-width: 520px;
      max-height: calc(100vh - 105px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .stage-image-wrap.lens-broadside img {
      max-height: calc(100vh - 290px);
      width: 100%;
      object-fit: contain;
    }

    .broadside-caption-sheet {
      display: none;
      width: 100%;
      padding-top: 20px;
      margin-top: 18px;
      border-top: 1px solid var(--border-rule);
      text-align: left;
    }

    .stage-image-wrap.lens-broadside .broadside-caption-sheet {
      display: block;
    }

    .broadside-verse-line {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.38rem;
      font-style: italic;
      line-height: 1.32;
      color: var(--text);
      margin-bottom: 10px;
      cursor: pointer;
    }

    .broadside-meta-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Open Chapbook Page inside Lightbox */
    .stage-reading-wrap {
      display: none;
      width: 100%;
      max-width: 640px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 48px 54px;
      background: var(--bg-plate);
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    .chapbook-meta-top {
      display: flex;
      justify-content: space-between;
      padding-bottom: 16px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-rule);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .chapbook-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.15;
      margin-bottom: 6px;
      color: var(--text);
    }

    .chapbook-author {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .pocket-poet-cover[data-litform="Fever Prose & Monologue"] .pocket-hook {
      text-align: left;
      padding-left: 14px;
      border-left: 2px solid var(--border-active);
      font-style: normal;
      font-weight: 400;
    }

    .pocket-poet-cover[data-litform="Aphorism & Treatise"] .pocket-hook {
      font-style: normal;
      letter-spacing: 0.01em;
    }

    .stage-reading-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.44rem;
      line-height: 1.68;
      color: var(--text);
      white-space: pre-line;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border-rule);
    }

    .stage-reading-wrap.prose-layout .stage-reading-text::first-letter {
      float: left;
      font-size: 3.4rem;
      line-height: 0.85;
      padding-right: 10px;
      padding-top: 4px;
      font-weight: 600;
      color: var(--text);
    }
    .stage-reading-text::first-letter, .stage-reading-wrap.prose-layout .stage-reading-text::first-letter { float: none !important; font-size: inherit !important; line-height: inherit !important; margin: 0 !important; padding: 0 !important; font-weight: inherit !important; color: inherit !important; }

    /* Lightbox optical & screenprint modes */
    .stage-image-wrap.lens-plate img {
      filter: grayscale(100%) contrast(145%) brightness(102%);
    }

    .stage-image-wrap.lens-woodcut img {
      filter: url(#stencilFilter);
    }

    .stage-image-wrap.lens-wheatpaste {
      background: #e8e1d3;
      padding: 14px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
    }

    .stage-image-wrap.lens-wheatpaste img {
      filter: grayscale(100%) contrast(255%) brightness(106%) sepia(14%);
      mix-blend-mode: multiply;
    }

    .stage-image-wrap.knockout-bg {
      background-image:
        linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.05) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.05) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.05) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      border-radius: 2px;
    }

    .halftone-overlay {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(12, 12, 14, 0.55) 1.15px, transparent 1.25px);
      background-size: 4px 4px;
      mix-blend-mode: multiply;
      z-index: 3;
    }

    .stage-image-wrap.lens-wheatpaste .halftone-overlay {
      display: block;
    }

    /* Barbara Kruger / Punk Paste-Up Street Stamp Banner */
    .street-stamp-banner {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 14%;
      transform: translateX(-50%) rotate(-1.6deg);
      background: #b8291e;
      color: #f6f4f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 500;
      font-size: clamp(0.82rem, 1.45vw, 1.18rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 5;
      cursor: pointer;
      user-select: none;
    }

    .street-stamp-banner.ink-black {
      background: #0d0d0f;
      color: #f6f4f0;
    }

    .stage-image-wrap.show-street-stamp .street-stamp-banner {
      display: block;
    }

    .stage-image-wrap.lens-duotone img {
      filter: url(#duotoneFilter);
    }

    /* Contextual Stencil & Wheatpaste Workshop Sub-Bar */
    .stencil-workshop-bar {
      display: none;
      margin-top: 10px;
      padding: 8px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stencil-workshop-bar.visible {
      display: flex;
    }

    .workshop-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .workshop-slider {
      width: 92px;
      accent-color: var(--text);
      cursor: pointer;
    }

    .stage-image-wrap.lens-detail {
      cursor: grab;
      user-select: none;
    }

    .stage-image-wrap.lens-detail.dragging {
      cursor: grabbing;
    }

    .stage-image-wrap.lens-detail.dragging img {
      transition: none !important;
    }

    /* Viewfinder Frame Overlay in Detail Loupe Mode */
    .loupe-viewfinder {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 0 0 9999px rgba(8, 8, 10, 0.62);
      z-index: 6;
      transition: width 0.2s ease, height 0.2s ease;
    }

    .loupe-viewfinder::before,
    .loupe-viewfinder::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    .stage-image-wrap.lens-detail .loupe-viewfinder {
      display: block;
    }

    .loupe-hint-badge {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(11, 11, 12, 0.75);
      padding: 2px 7px;
      border-radius: 3px;
      pointer-events: none;
    }

    /* Contextual Detail Loupe Mining Bar */
    .detail-loupe-bar {
      display: none;
      margin-top: 10px;
      padding: 7px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .detail-loupe-bar.visible {
      display: flex;
    }

    /* Mined Details Strip in Sidebar */
    .mined-details-section {
      display: none;
      margin-bottom: 22px;
    }

    .mined-details-section.visible {
      display: block;
    }

    .mined-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .mined-thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--bg);
      border: 1px solid var(--border-active);
      overflow: hidden;
      cursor: pointer;
      padding: 0;
    }

    .mined-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center center;
    }

    /* Gallery Card Detail Clipping Frame */
    .art-frame.detail-clip-frame {
      overflow: hidden;
      position: relative;
    }

    .detail-clip-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 4;
      background: rgba(11, 11, 12, 0.82);
      color: #eae8e3;
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      pointer-events: none;
    }

    .stage-controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Quiet sidebar in Lightbox */
    .lightbox-aside {
      border-left: 1px solid var(--border);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      overflow-y: auto;
      background: var(--bg-elevated);
    }

    @media (max-width: 520px) {
      .lightbox-aside {
        height: auto;
        border-left: none;
        border-top: 1px solid var(--border);
        padding: 24px 18px 42px;
      }
    }

    .aside-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .lb-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.65rem;
      font-weight: 500;
      line-height: 1.18;
      margin-bottom: 6px;
    }

    .lb-artist {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .lb-origin {
      font-size: 0.74rem;
      color: var(--text-faint);
      margin-bottom: 22px;
    }

    .lb-note {
      font-size: 0.82rem;
      line-height: 1.62;
      color: var(--text);
      opacity: 0.88;
      margin-bottom: 18px;
    }

    .lb-quote {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.02rem;
      line-height: 1.44;
      color: var(--text-muted);
      margin-bottom: 22px;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .lb-quote:hover {
      color: var(--text);
    }

    /* Minimal 5-dot palette */
    .lb-palette {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    /* Collapsible Museum & Craft Specs Accordion */
    .specs-accordion-wrap {
      margin-bottom: 24px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 9px 0;
    }

    .specs-toggle-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 2px 0;
      transition: color 0.15s ease;
    }

    .specs-toggle-btn:hover {
      color: var(--text);
    }

    .specs-drawer {
      display: none;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.75rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .specs-drawer.open {
      display: grid;
      grid-template-columns: 98px 1fr;
      gap: 8px 12px;
    }

    .spec-key {
      color: var(--text-faint);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .spec-val {
      color: var(--text);
      opacity: 0.9;
      word-break: break-word;
    }

    .swatch-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .swatch-dot:hover {
      transform: scale(1.22);
    }

    .swatch-feedback {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Barnes Ensemble / Chapbook Companion Visual Wall */
    .ensemble-section {
      margin-bottom: 24px;
    }

    .ensemble-heading {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      margin-bottom: 10px;
    }

    .ensemble-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .ensemble-thumb {
      aspect-ratio: 1 / 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .ensemble-thumb:hover {
      transform: translateY(-2px);
      border-color: var(--border-active);
    }

    .ensemble-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .aside-footer {
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .quiet-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.76rem;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s ease;
    }

    .quiet-link:hover {
      color: var(--text);
    }


    /* =========================================================================
       v33: MINIMALIST WALL SUB-BAR, DUAL-TRACK TIMELINE & READING ROOM
       ========================================================================= */
    .wall-controls-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      margin: 0 0 26px;
      opacity: 0.94;
      transition: opacity 0.22s ease;
    }
    .wall-controls-bar:hover {
      opacity: 1;
    }
    body:has(.gallery-grid.pure-wall) .wall-controls-bar {
      opacity: 0.45;
    }
    body:has(.gallery-grid.pure-wall) .wall-controls-bar:hover {
      opacity: 1;
    }
    .wall-micro-btn {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      padding: 3px 0;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.71rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.16s ease, border-color 0.16s ease;
    }
    .wall-micro-btn:hover,
    .wall-micro-btn.active {
      color: var(--text);

    header {

    /* ==========================================================================

       (Chromatic Apothecary · Gesture Pinboard · 24h Circadian Dial ·

       ========================================================================== */
    .spatial-views-drawer {

    .lens-header-bar {

    /* Two-column Instrument + Specimen Shelf Layout */

      }

    .map-canvas-box {

    /* Chromatic Apothecary */

    .warburg-board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 20px;

      border: 1px solid rgba(255, 255, 255, 0.13);

      flex-direction: column;

      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.1);

      flex-direction: column;

    /* Era as a timeline you draw on, Region as a map (22 Nov 2026) */

    /* the dissolve between walls; the page stays live under it so a drag is never interrupted */

<script id="writingForms">
  // Writing forms: the library's 400-odd form labels folded into nine a reader would ask for.
  // The first rule that matches wins; a rule can carry words that rule it out.
  const POEMISH = /poem|poetry|verse|lyric|masnavi|epic|ode\b|sonnet|couplets(?!.*kuṛaḷ)/i;
  const FORM_RULES = [
    ['Slogan & chant', /^slogan/i],
    ['Play', /^play$|verse drama|lyrical drama|tragedy|tragic|soliloquy|stage|chorus|dramatic verse|monologue/i, /fever|prose|dramatic monologue|free-verse|epitaph/i],
    ['Speech', /oratory|speech|address|lecture|sermon|oration|council reply|last words|interview|reported remark|^conversation$|spoken words/i],
    ['Letter', /letter|epistle|epistolary manifesto/i, /novel/i],
    ['Diary & notebook', /diary|journal|notebook|memoir|autobiograph|pillow book|zuihitsu|riḥla|travelogue|testimony/i],
    ['Manifesto', /manifesto|pamphlet|editorial|formal protest|proclamation|charter/i],
    ['Scripture & prayer', /sacred|scripture|psalm|upanishad|sutra|rigveda|prayer|biblical|hymn(?! & anthem)|canticle|devotional|spiritual|analects|stotra|vachana|vakh|bhajan|abhang|karakia|^prophecy$/i],
    ['Aphorism & philosophy', /aphoris|maxim|proverb|sayings|philosoph|treatise|wisdom|parable|fable|dialogue|axiom|precept|subhāṣita|śubhāṣita|kuṛaḷ|military order|lexicon|counsel|oracle|sebayt|poetics|graffit|satirical definition/i, null, true],
    ['Poem', /dramatic monologue|poem|poetry|verse|sonnet|lyric|ode|ballad|haiku|waka|ghazal|quatrain|song|elegy|epic|chant|epigram|couplet|masnavi|qa[sṣ][iī]da|rub[aā]|jueju|wǔjué|qījué|gǔfēng|yuefu|stanza|rondeau|ballade|redondilla|letrilla|carol|rhyme|lament|dirge|marthiya|khamriyya|ottava|terza|hexameter|chu ci|octet|epitaph|dinggedicht|fragment|mele|xóchitl|kalevala|anthem|dactylic|alexandrine|bhakti|kolomyika|runo|canoe|refrain|imagist|image|meditation/i],
    ['Prose', /novel|story|tale|prose|fever|essay|sketch|romance|myth|narrative|historiograph|satire|book|unfinished|chronicle|pulp|phantasmagoria|preface|science writing|nachtstück|court opinion/i],
  ];

      const m = (medStr || '').toLowerCase();
      if (itemType === 'literature') {

      }
      if (/woodblock|woodcut|linocut/.test(m)) return 'Relief-carved woodblock matrix; hand-inked on raised surfaces and burnished or press-pulled on archival paper.';
      if (/etching|aquatint|drypoint/.test(m)) return 'Intaglio metal plate bitten in acid or incised with drypoint needle; hand-wiped and pulled through a roller press.';
      if (/engraving/.test(m)) return 'Intaglio copperplate cut directly with a steel burin in parallel and cross-hatched furrows.';
      if (/lithograph|zincograph/.test(m)) return 'Planographic limestone or metal plate drawn with grease medium and printed via water-and-oil chemical repulsion.';
      if (/oil|tempera|canvas|panel/.test(m)) return 'Hand-ground mineral and organic pigments layered over prepared support from dark underpainting to opaque highlights.';
      if (/ink|watercolor|scroll|chalk|charcoal|pastel/.test(m)) return 'Direct brush or dry-media mark-making on absorbent paper or sized silk support.';
      if (/bronze|steel|iron|gold|brass|armor|sword/.test(m)) return 'Lost-wax cast or hammer-forged and embossed metalwork, cold-chased and patinated.';
      if (/marble|stone|alabaster|terracotta|ceramic/.test(m)) return 'Carved stone or kiln-fired ceramic body worked with chisels, rasps, or mineral slip glazes.';
      return 'Hand-worked museum object executed on archival support.';
    }

    function scoreCategory(titleStr, descStr, rules, fallback) {
      const t = titleStr || '';
      const d = descStr || '';
      let best = fallback;
      let bestScore = 0;
      for (const rule of rules) {
        const titleMatches = (t.match(rule.re) || []).length;
        const descMatches = (d.match(rule.re) || []).length;
        const score = titleMatches * 3 + descMatches;
        if (score > bestScore) {
          bestScore = score;
          best = rule.name;
        }
      }
      return best;
    }

    function smallImageUrl(u) {
      if (!u) return '';
      if (u.includes('/960px-')) return u.replace('/960px-', '/500px-');
      if (u.includes('artic.edu/iiif/') && u.includes('/full/843,/')) return u.replace('/full/843,/', '/full/400,/');

    function setTileImage(img, u, sizes) {

        img.sizes = sizes || '(max-width: 700px) 50vw, 25vw';
        // If the small file fails (throttling), retry with the full one before any hide-on-error handler runs.
        img.addEventListener('error', (e) => {

    function hexToRgb255(hex) {
      const clean = (hex || '#181818').replace('#', '').trim();
      const n = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
      if (isNaN(n)) return [24, 24, 24];
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function minPaletteDistance(work, targetHex) {
      const target = hexToRgb255(targetHex);
      const pal = Array.isArray(work.palette) && work.palette.length > 0 ? work.palette : ['#181818'];
      let best = 999;
      for (const h of pal) {
        const c = hexToRgb255(h);
        // Perceptual redmean-weighted RGB distance
        const rmean = (target[0] + c[0]) / 2;
        const dr = target[0] - c[0];
        const dg = target[1] - c[1];
        const db = target[2] - c[2];
        const d = Math.sqrt((2 + rmean / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rmean) / 256) * db * db) * 0.52;
        if (d < best) best = d;
      }
      return best;
    }

    function filterWorks(preserveScroll = false) {
      // First apply structural facets (Saved, Pigment Hunt, Material Pivot, Timeline, Index selects)
      // Works whose picture failed to load are dropped after the search, not before it: the search's cut-off is set by its
      // best match, so taking a strong work out first changed how many others came back (23 Nov 2026).
      let basePool = WORKS.filter(w => {
        if (state.onlySaved) {
          if (state.activeStack !== 'ALL') {
            const stackIds = state.stacks[state.activeStack] || [];
            if (!stackIds.includes(w.id)) return false;
          } else if (!state.savedIds.has(w.id)) {
            return false;
          }
        }
        if (state.pigmentHex && minPaletteDistance(w, state.pigmentHex) > 108) return false;
        if (state.materialPivotKey) {
          const mPivot = MATERIAL_PIVOTS.find(m => m.key === state.materialPivotKey);
          if (mPivot && !mPivot.re.test(`${w.medium || ''} ${w.craftSpec || ''} ${w.title || ''}`)) return false;
        }
        if (state.timelineActive) {
          const y = typeof w.yearNum === 'number' ? w.yearNum : parseYearNumJs(null, w.dateLabel);
          const minY = state.timelineCenterYear - state.timelineSpan;
          const maxY = state.timelineCenterYear + state.timelineSpan;
          if (y < minY || y > maxY) return false;
        }
        if (state.sortMode === 'CLASSICS_ONLY' && (w.iconicScore || 0) < 135) return false;
        if (state.museum !== 'ALL' && w.museum !== state.museum) return false;
        if (state.region !== 'ALL' && w.macroRegion !== state.region) return false;
        if (state.medium !== 'ALL' && w.macroMedium !== state.medium) return false;
        if (state.form !== 'ALL' && w.graphicForm !== state.form) return false;
        if (state.era !== 'ALL' && w.eraBucket !== state.era) return false;
        if (state.tone !== 'ALL' && w.colorFamily !== state.tone) return false;
        if (window.pvPass && !window.pvPass(w)) return false;
        return true;
      });

      const rawQ = state.query.trim();
      let filtered = basePool;
      let searchRanked = false;

      if (rawQ && typeof runFiveStageArchiveSearch === 'function') {
        const res = runFiveStageArchiveSearch(basePool, rawQ);
        filtered = res.items;
        searchRanked = true;
        const relaxEl = document.getElementById('relaxedSearchBadge');
        if (relaxEl) {
          if (res.relaxed && res.items.length > 0) {
            relaxEl.textContent = `Closest matches (${res.matchedTokens} of ${res.totalTokens} terms)`;
            relaxEl.classList.add('visible');
          } else {
            relaxEl.textContent = '';
            relaxEl.classList.remove('visible');
          }
        }
      } else {
        const relaxEl = document.getElementById('relaxedSearchBadge');
        if (relaxEl) {
          relaxEl.textContent = '';
          relaxEl.classList.remove('visible');
        }
      }

      if (searchRanked) {
        // Preserve 5-Stage relevance order already computed
      } else if (state.pigmentHex) {
        filtered.sort((a, b) => minPaletteDistance(a, state.pigmentHex) - minPaletteDistance(b, state.pigmentHex));
      } else if (state.sortMode === 'DEEP_CUTS') {
        filtered.sort((a, b) => {
          const aDeep = a.isPantheon ? 0 : 1;
          const bDeep = b.isPantheon ? 0 : 1;
          if (aDeep !== bDeep) return bDeep - aDeep;
          return (b.iconicScore || 0) - (a.iconicScore || 0);
        });
      } else if (state.sortMode === 'CLASSICS_ONLY') {
        filtered.sort((a, b) => (b.iconicScore || 0) - (a.iconicScore || 0));
      }

      filtered = filtered.filter(w => !w._broken);
      state.currentList = window.pvArrange ? window.pvArrange(filtered, searchRanked) : filtered;

      updateCountDisplay();
      if (typeof syncLiveSearchPillUI === 'function') syncLiveSearchPillUI();
      savedKitBar.classList.toggle('visible', state.onlySaved);

      const wallBarEl = document.getElementById('wallControlsBar');

        galleryGrid.style.display = 'none';

        if (stageEl) {

      } else if (!preserveScroll) {

      } else if (state.renderedCount < PAGE_BATCH_SIZE && state.currentList.length > state.renderedCount) {
        appendNextBatch();
      }
    }

        frame.className = w.isDetailClip ? 'art-frame detail-clip-frame' : 'art-frame';
        if (w.isDetailClip && w.detailCrop) {
          if (w.detailCrop.aspect === '1:1') frame.style.aspectRatio = '1 / 1';
          else if (w.detailCrop.aspect === '9:16') frame.style.aspectRatio = '9 / 16';
          else if (w.detailCrop.aspect === '3:4') frame.style.aspectRatio = '3 / 4';

          const badge = document.createElement('span');
          badge.className = 'detail-clip-badge';
          badge.textContent = `Detail · ${w.detailCrop.zoom.toFixed(1)}×`;
          frame.appendChild(badge);
        }

        // Until the file arrives the tile holds the picture's own main colour at its own shape, so nothing jumps (22 Nov 2026).
        const [pr, pg, pb] = hexToRgb255((w.palette && w.palette[0]) || '#181818');
        frame.style.backgroundColor = `rgba(${pr}, ${pg}, ${pb}, 0.55)`;

        const img = document.createElement('img');
        if (!w.isDetailClip) img.className = 'img-loading';
        img.loading = 'lazy';
        img.decoding = 'async';
        if (w.isDetailClip) img.src = w.imageUrl;
        else setTileImage(img, w.imageUrl, `(max-width: 700px) ${Math.round(100 / Math.max(1, state.colCount || 2))}vw, ${Math.round(100 / Math.max(1, state.colCount || 4))}vw`);
        img.alt = [w.title, w.artist].filter(Boolean).join(', ');
        img.loading = 'lazy';
        if (!w.isDetailClip && w.ar > 0) img.style.aspectRatio = String(w.ar);
        if (w.isDetailClip && w.detailCrop) {
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          img.style.transformOrigin = 'center center';
          img.style.transform = `translate(${w.detailCrop.panPctX || 0}%, ${w.detailCrop.panPctY || 0}%) scale(${w.detailCrop.zoom || 2})`;
        } else {
          const revealImg = () => {
            img.classList.remove('img-loading');
            img.classList.add('img-loaded');
          };
          if (img.complete && img.naturalWidth > 0) {
            revealImg();
          } else {
            img.addEventListener('load', revealImg, { once: true });
          }
        }
        img.addEventListener('error', () => {
          article.style.display = 'none';
          w._broken = true;
        });

        frame.appendChild(img);
        article.appendChild(frame);
      }

      const caption = document.createElement('div');
      caption.className = 'art-caption';

      const h3 = document.createElement('h3');
      h3.className = 'caption-title';
      h3.textContent = w.title;

      const meta = document.createElement('span');
      meta.className = 'caption-meta';
      meta.textContent = w.dateLabel ? `${w.artist}, ${w.dateLabel}` : w.artist;

      caption.appendChild(h3);
      caption.appendChild(meta);
      article.appendChild(caption);

      article.addEventListener('click', () => {
        const liveIdx = state.currentList.findIndex(item => item.id === w.id);
        if (liveIdx !== -1) {
          openLightbox(liveIdx);
        } else {
          state.currentList.unshift(w);
          openLightbox(0);
        }
      });

      return article;
    }

    function renderGalleryInitial() {
      galleryGrid.innerHTML = '';
      state.renderedCount = 0;
      state.colCount = computeColumnCount();
      state.colElements = [];

      const wallBarEl = document.getElementById('wallControlsBar');
      if (state.currentList.length === 0) {
        if (wallBarEl) wallBarEl.style.display = 'none';
        galleryGrid.style.display = 'none';
        emptyState.style.display = 'block';
        // say what the empty wall means, plainly (23 Nov 2026)
        const et = document.getElementById('emptyStateTitle'), ep = document.getElementById('emptyRecoveryPills');
        if (ep) ep.style.display = 'none';
        const emptyBoard = state.onlySaved && state.activeStack && state.activeStack !== 'ALL' && !((state.stacks[state.activeStack] || []).length);
        if (et) et.textContent = emptyBoard ? 'This board is empty. Open a work, press Save and pick this board.'
          : state.onlySaved && !(state.savedIds && state.savedIds.size) ? 'Nothing saved yet. Open a work and press Save.'
          : state.onlySaved ? 'Nothing saved matches this. Clear the search or a filter.' : 'Nothing matches all of that. Drop a filter to widen it.';
        return;
      }

      if (wallBarEl && (!state.spatialView || state.spatialView === 'wall')) wallBarEl.style.display = '';
      galleryGrid.style.display = 'block';
      emptyState.style.display = 'none';

      // The wall is one positioned layer (23 Nov 2026): every card is placed in the shortest column, and a wide picture
      // takes two columns so it is not shrunk to a sliver (Paul: wide work was at a disadvantage). See masonLayout().
      galleryGrid.classList.add('pv-mason');
      state.colElements = [galleryGrid];

      if (typeof triggerRoomSoftSettle === 'function') triggerRoomSoftSettle(galleryGrid);
      appendNextBatch();
    }

    function appendNextBatch() {
      if (state.renderedCount >= state.currentList.length || state.colElements.length === 0) return;
      const startIdx = state.renderedCount;
      const nextEnd = Math.min(startIdx + PAGE_BATCH_SIZE, state.currentList.length);
      for (let i = startIdx; i < nextEnd; i++) {
        const cardEl = createCardElement(state.currentList[i], i);
        const staggerMs = Math.min(240, (i - startIdx) * 20);
        cardEl.style.setProperty('--stagger-ms', `${staggerMs}ms`);
        cardEl.classList.add('cascade-in');
        galleryGrid.appendChild(cardEl);
      }
      state.renderedCount = nextEnd;
      masonLayout();
    }

    // Wide works span two columns: at three or four columns anything 1.7 times wider than tall, at two columns
    // anything 2.2 times wider (then it is the full width). One column stays one column. A wide work waits up to
    // three places for two neighbouring columns that end near the same height, so it does not leave a hole.
    function masonSpan(w, cols) {
      if (!w || w.itemType === 'literature' || !(w.ar > 0)) return 1;
      if (cols >= 3 && w.ar >= 1.7) return 2;
      if (cols === 2 && w.ar >= 2.2) return 2;
      return 1;
    }
    let masonProbe = null;
    function masonGaps() {
      const cs = getComputedStyle(galleryGrid);
      const colGap = parseFloat(cs.columnGap) || 38;
      if (!masonProbe) { masonProbe = document.createElement('div'); masonProbe.className = 'masonry-col'; masonProbe.style.cssText = 'position:absolute;visibility:hidden;height:0;'; }
      galleryGrid.appendChild(masonProbe);
      const rowGap = parseFloat(getComputedStyle(masonProbe).rowGap) || 48;
      masonProbe.remove();
      return { colGap, rowGap };
    }
    function masonLayout() {
      if (!galleryGrid.classList.contains('pv-mason') || galleryGrid.style.display === 'none') return;
      const cards = [...galleryGrid.children].filter(el => el.classList.contains('art-piece'));
      const cols = state.colCount || 1;
      const W = galleryGrid.clientWidth; if (!W) return;
      const { colGap, rowGap } = masonGaps();
      const colW = (W - colGap * (cols - 1)) / cols;
      // widths first, then read every height, then write every position (one read pass, one write pass)
      const spans = cards.map(el => masonSpan(state.currentList[+el.dataset.idx], cols));
      cards.forEach((el, k) => { el.style.width = (spans[k] === 2 ? colW * 2 + colGap : colW) + 'px'; });
      const hs = cards.map(el => el.offsetHeight);
      const H = new Array(cols).fill(0), pos = new Array(cards.length);
      const placeOne = k => { let c = 0; for (let j = 1; j < cols; j++) if (H[j] < H[c] - 0.5) c = j; pos[k] = [c, H[c]]; H[c] += hs[k] + rowGap; };
      const bestPair = () => { let b = 0, bh = Infinity; for (let j = 0; j < cols - 1; j++) { const h = Math.max(H[j], H[j + 1]); if (h < bh - 0.5) { bh = h; b = j; } } return b; };
      const placeTwo = k => { const j = bestPair(), t = Math.max(H[j], H[j + 1]); pos[k] = [j, t]; H[j] = H[j + 1] = t + hs[k] + rowGap; };
      const level = () => { const j = bestPair(); return Math.abs(H[j] - H[j + 1]) <= colW * 0.3; };
      let wait = [];   // [card index, places waited]
      const tryWaiting = (force) => { wait = wait.filter(([k, n]) => { if (force || n >= 3 || level()) { placeTwo(k); return false; } return true; }); };
      for (let k = 0; k < cards.length; k++) {
        if (!hs[k]) { pos[k] = [0, 0]; continue; }   // a hidden card (its picture failed) takes no room
        if (spans[k] === 2) { wait.push([k, 0]); tryWaiting(false); continue; }
        placeOne(k);
        wait.forEach(x => x[1]++); tryWaiting(false);
      }
      tryWaiting(true);
      cards.forEach((el, k) => { const [c, t] = pos[k]; el.style.left = (c * (colW + colGap)) + 'px'; el.style.top = t + 'px'; });
      galleryGrid.style.height = Math.max(0, Math.max(...H) - rowGap) + 'px';
    }
    window.pvMasonLayout = masonLayout;
    let masonRaf = 0;
    const masonSoon = () => { cancelAnimationFrame(masonRaf); masonRaf = requestAnimationFrame(masonLayout); };
    if (window.ResizeObserver) {
      // a card that changes height (captions on or off, a font arriving, a picture whose shape was unknown) re-lays the wall
      const masonRO = new ResizeObserver(masonSoon);
      new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.classList && n.classList.contains('art-piece')) masonRO.observe(n); })))
        .observe(galleryGrid, { childList: true });
    }

    window.addEventListener('resize', () => {
      if (state.spatialView && state.spatialView !== 'wall') return;
      const nextCols = computeColumnCount();
      if (nextCols !== state.colCount) {
        renderGalleryInitial();
      } else masonSoon();
    });

    const io = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) {
        appendNextBatch();
      }
    }, { rootMargin: '900px 0px' });
    io.observe(scrollSentinel);

    function computeCmaIconicScore(rec, title, artist, descStr) {
      let score = 20;
      if (rec.is_highlight) score += 55;
      if (rec.current_location) score += 30;
      if (rec.did_you_know) score += 12;
      if (Array.isArray(rec.citations)) score += Math.min(20, rec.citations.length * 2);
      if (rec.exhibitions && Array.isArray(rec.exhibitions.legacy)) score += Math.min(18, rec.exhibitions.legacy.length * 3);
      if (CANONICAL_MASTERS_RE.test(artist)) score += 35;
      if (WOMEN_ARTIST_BOOST_RE.test(artist)) score += 45;
      if (descStr.length > 120) score += 8;
      if (DERIVATIVE_OR_STUDY_RE.test(`${title} ${artist}`)) score -= 65;
      return score;
    }

    function computeAicIconicScore(rec, title, artist, descStr) {
      let score = 20;
      if (rec.is_boosted) score += 55;
      if (typeof rec.boost_rank === 'number' && rec.boost_rank > 0) score += Math.max(15, 40 - rec.boost_rank);
      if (rec.is_on_view) score += 30;
      if (rec.has_not_been_viewed_much === false) score += 10;
      if (rec.has_not_been_viewed_much === true) score -= 20;
      if (CANONICAL_MASTERS_RE.test(artist)) score += 35;
      if (WOMEN_ARTIST_BOOST_RE.test(artist)) score += 45;
      if (descStr.length > 80) score += 10;
      if (DERIVATIVE_OR_STUDY_RE.test(`${title} ${artist}`)) score -= 65;
      return score;
    }

    function parseCmaRecord(rec, stream) {
      if (!rec || rec.share_license_status !== 'CC0') return null;
      const imgUrl = rec.images && rec.images.web && rec.images.web.url;
      if (!imgUrl) return null;
      const highResUrl = (rec.images && rec.images.print && rec.images.print.url) || imgUrl;

      const title = (rec.title || '').trim();
      const typeStr = rec.type || '';
      const techStr = rec.technique || '';
      const deptStr = rec.department || '';

      if (!title || isRejectedObject(title, typeStr, `${rec.culture || ''} ${techStr}`)) return null;
      if (!ALLOWED_TYPE_RE.test(`${typeStr} ${techStr} ${deptStr}`)) return null;

      let artist = 'Unknown Artist';
      if (Array.isArray(rec.creators) && rec.creators.length > 0 && rec.creators[0].description) {
        artist = rec.creators[0].description.split('(')[0].trim();
      } else if (Array.isArray(rec.culture) && rec.culture.length > 0) {
        artist = rec.culture[0].split(',')[0].trim();
      }

      const cultureStr = Array.isArray(rec.culture) ? rec.culture.join(', ') : (deptStr || 'Archive');
      const descStr = (rec.description || '').replace(/<[^>]+>/g, '').trim();
      const iconicScore = computeCmaIconicScore(rec, title, artist, descStr);
      if (iconicScore < 15) return null;

      const subjectShort = scoreCategory(title, descStr, SUBJECT_RULES, stream.subj);
      const emotionShort = scoreCategory(title, descStr, EMOTION_RULES, stream.emo);
      const medDisplay = techStr || typeStr || 'Mixed Media';
      const mRegion = classifyMacroRegion(cultureStr, deptStr);
      const matchedVerse = matchCanonicalVerse(subjectShort, emotionShort, mRegion, rec.id || 0);

      let cleanDesc = descStr;
      if (cleanDesc.length > 280) {
        cleanDesc = cleanDesc.slice(0, 277).replace(/\s+\S*$/, '') + '…';
      }
      if (!cleanDesc) {
        cleanDesc = `${cultureStr} (${rec.creation_date || 'historic'}). ${medDisplay}. Open-access masterwork from The Cleveland Museum of Art.`;
      }

      return {
        id: `CMA-${rec.id}`,
        itemType: 'art',
        title,
        artist,
        dateLabel: rec.creation_date || '',
        yearNum: parseYearNumJs(rec.creation_date_earliest, rec.creation_date),
        eraBucket: classifyEraBucket(rec.creation_date_earliest, rec.creation_date),
        colorFamily: classifyColorFamily(medDisplay, subjectShort, emotionShort, title),
        graphicForm: classifyGraphicForm(techStr, typeStr),
        region: cultureStr,
        medium: medDisplay,
        subjectShort,
        emotionShort,
        macroRegion: mRegion,
        macroMedium: classifyMacroMedium(techStr, typeStr),
        imageUrl: imgUrl,
        highResUrl,
        sourceUrl: rec.url || `https://www.clevelandart.org/art/${rec.accession_number || rec.id}`,
        museum: 'Cleveland Museum of Art',
        note: cleanDesc,
        quote: matchedVerse.quote,
        quoteAuthor: matchedVerse.quoteAuthor,
        palette: PALETTES_BY_MOOD[emotionShort] || PALETTES_BY_MOOD['Resolve'],
        iconicScore
      };
    }

    function parseSmkRecord(rec, stream) {
      if (!rec || !rec.public_domain || !rec.has_image || !rec.image_thumbnail) return null;
      const imgUrl = rec.image_thumbnail;
      const highResUrl = rec.image_native || imgUrl;

      let title = '';
      if (Array.isArray(rec.titles) && rec.titles.length > 0 && rec.titles[0].title) {
        title = rec.titles[0].title.trim();
      }
      const objNames = Array.isArray(rec.object_names) ? rec.object_names.map(x => x.name || '').join(', ') : '';
      const techStr = Array.isArray(rec.techniques) ? rec.techniques.join(', ') : '';
      if (!title || isRejectedObject(title, objNames, techStr)) return null;

      let artist = 'Unknown Master';
      let nation = 'Denmark / Europe';
      if (Array.isArray(rec.production) && rec.production.length > 0) {
        const prod = rec.production[0];
        if (prod.creator) {
          const parts = prod.creator.split(',');
          artist = parts.length === 2 ? `${parts[1].trim()} ${parts[0].trim()}` : prod.creator.trim();
        }
        if (prod.creator_nationality) nation = prod.creator_nationality;
      }

      let dateLabel = '';
      let earliestYear = null;
      if (Array.isArray(rec.production_date) && rec.production_date.length > 0) {
        dateLabel = rec.production_date[0].period || '';
        if (rec.production_date[0].start) {
          earliestYear = parseInt(String(rec.production_date[0].start).slice(0, 4), 10);
        }
      }

      let iconicScore = 30;
      if (rec.current_location_name) iconicScore += 35;
      if (CANONICAL_MASTERS_RE.test(artist)) iconicScore += 38;
      if (WOMEN_ARTIST_BOOST_RE.test(artist)) iconicScore += 45;
      if (Array.isArray(rec.exhibitions) && rec.exhibitions.length > 0) iconicScore += Math.min(20, rec.exhibitions.length * 3);
      if (DERIVATIVE_OR_STUDY_RE.test(`${title} ${artist}`)) iconicScore -= 60;
      if (iconicScore < 15) return null;

      const subjectShort = scoreCategory(title, `${objNames} ${techStr}`, SUBJECT_RULES, stream.subj);
      const emotionShort = scoreCategory(title, `${objNames} ${techStr}`, EMOTION_RULES, stream.emo);
      const medDisplay = techStr || objNames || 'Work on Canvas / Paper';
      const mRegion = classifyMacroRegion(nation, 'European Art');
      const numSeed = parseInt(String(rec.object_number || '1').replace(/\D/g, '') || '1', 10);
      const matchedVerse = matchCanonicalVerse(subjectShort, emotionShort, mRegion, numSeed);

      const palette = (Array.isArray(rec.colors_palette) && rec.colors_palette.length >= 5)
        ? rec.colors_palette.slice(0, 5)
        : (PALETTES_BY_MOOD[emotionShort] || PALETTES_BY_MOOD['Resolve']);

      const locNote = rec.current_location_name ? `Currently on view (${rec.current_location_name}). ` : '';
      const cleanDesc = `${locNote}${nation} (${dateLabel || 'historic'}). ${medDisplay}. Open-access masterwork from SMK — Statens Museum for Kunst (National Gallery of Denmark, Copenhagen).`;

      return {
        id: `SMK-${rec.object_number || Math.random().toString(36).slice(2, 8)}`,
        itemType: 'art',
        title,
        artist,
        dateLabel,
        yearNum: parseYearNumJs(earliestYear, dateLabel),
        eraBucket: classifyEraBucket(earliestYear, dateLabel),
        colorFamily: classifyColorFamily(medDisplay, subjectShort, emotionShort, title),
        graphicForm: classifyGraphicForm(techStr, objNames),
        region: `${nation} (SMK Copenhagen)`,
        medium: medDisplay,
        subjectShort,
        emotionShort,
        macroRegion: mRegion,
        macroMedium: classifyMacroMedium(techStr, objNames),
        imageUrl: imgUrl,
        highResUrl,
        sourceUrl: rec.frontend_url || `https://open.smk.dk/en/artwork/image/${encodeURIComponent(rec.object_number || '')}`,
        museum: 'SMK – Copenhagen',
        note: cleanDesc,
        quote: matchedVerse.quote,
        quoteAuthor: matchedVerse.quoteAuthor,
        palette,
        iconicScore
      };
    }

    function parsePoetryDbRecord(poem, stream, idx) {
      if (!poem || !Array.isArray(poem.lines) || poem.lines.length < 4) return null;

      const artist = (poem.author || '').trim();

      const emotionShort = scoreCategory(title, fullText, EMOTION_RULES, stream.emo);

      return {
        id: `PDB-${artist.slice(0, 6)}-${idx}`,

        subjectShort,
        emotionShort,

        macroMedium: 'Literature & Verse',
        hook,
        excerpt,
        fullText,
        imageUrl: '',
        highResUrl: 'https://poetrydb.org/',
        sourceUrl: 'https://poetrydb.org/',
        museum: 'Pocket Poets Canon',
        note: `Complete public-domain verse by ${artist} (${stream.date}), indexed via PoetryDB.`,
        quote: hook,

      };
    }

    function deduplicateKeepMostIconic(candidates) {
      const bestByKey = new Map();
      const usedUrls = new Set();
      const sorted = [...candidates].sort((a, b) => (b.iconicScore || 0) - (a.iconicScore || 0));
      const result = [];
      for (const item of sorted) {
        if (!item) continue;
        if (item.itemType !== 'literature') {
          if (!item.imageUrl || usedUrls.has(item.imageUrl)) continue;
          usedUrls.add(item.imageUrl);
        }
        const key = normalizeKey(item.title, item.artist);
        if (bestByKey.has(key)) continue;
        bestByKey.set(key, item);
        result.push(item);
      }
      return result;
    }

    function selectTopIconic(allCandidates) {
      const deduped = deduplicateKeepMostIconic(allCandidates);
      if (deduped.length <= TARGET_TOTAL) {
        return interleaveAndSpaceArtists(deduped);
      }

      const cellMap = new Map();
      for (const item of deduped) {
        const cellKey = `${item.emotionShort}__${item.subjectShort}`;
        if (!cellMap.has(cellKey)) cellMap.set(cellKey, []);
        cellMap.get(cellKey).push(item);
      }

      const pickedIds = new Set();
      const selected = [];

      for (const s of SEED_WORKS) {
        pickedIds.add(s.id);
        selected.push(s);
      }

      for (const [, list] of cellMap.entries()) {
        list.sort((a, b) => (b.iconicScore || 0) - (a.iconicScore || 0));
        let count = 0;
        for (const item of list) {
          if (count >= 20 || selected.length >= TARGET_TOTAL) break;
          if (!pickedIds.has(item.id)) {
            pickedIds.add(item.id);
            selected.push(item);
            count++;
          }
        }
      }

      for (const item of deduped) {
        if (selected.length >= TARGET_TOTAL) break;
        if (!pickedIds.has(item.id)) {
          pickedIds.add(item.id);
          selected.push(item);
        }
      }

      const seedIdSet = new Set(SEED_WORKS.map(s => s.id));
      const harvestedOnly = selected.filter(x => !seedIdSet.has(x.id));
      const interleavedHarvested = interleaveAndSpaceArtists(harvestedOnly);
      return [...(state.minedClips || []), ...SEED_WORKS, ...interleavedHarvested].slice(0, TARGET_TOTAL);
    }

    function interleaveAndSpaceArtists(items) {
      const litList = items.filter(x => x.itemType === 'literature');
      const pantheonPool = items.filter(x => x.itemType !== 'literature' && x.isPantheon).sort((a, b) => (b.iconicScore || 0) - (a.iconicScore || 0));
      const artItems = items.filter(x => x.itemType !== 'literature' && !x.isPantheon);

      const pantheonOut = [];
      while (pantheonPool.length > 0) {
        const recent = new Set(pantheonOut.slice(-4).map(x => x.artist));
        let pIdx = 0;
        for (let i = 0; i < pantheonPool.length; i++) {
          if (!recent.has(pantheonPool[i].artist)) { pIdx = i; break; }
        }
        pantheonOut.push(pantheonPool.splice(pIdx, 1)[0]);
      }

      const buckets = {};
      artItems.forEach(item => {
        const k = item.macroRegion || 'Other';
        if (!buckets[k]) buckets[k] = [];
        buckets[k].push(item);
      });
      Object.values(buckets).forEach(arr => arr.sort((a, b) => (b.iconicScore || 0) - (a.iconicScore || 0)));

      const keys = Object.keys(buckets);
      const artOut = [];
      let added = true;
      while (added) {
        added = false;
        for (const k of keys) {
          const b = buckets[k];
          if (b && b.length > 0) {
            const recentArtists = new Set(artOut.slice(-7).map(x => x.artist));
            let pickIdx = 0;
            for (let i = 0; i < b.length; i++) {
              if (!recentArtists.has(b[i].artist)) {
                pickIdx = i;
                break;
              }
            }
            artOut.push(b.splice(pickIdx, 1)[0]);
            added = true;
          }
        }
      }

      const combinedArt = [...pantheonOut, ...artOut];
      if (combinedArt.length === 0) return litList;
      if (litList.length === 0) return combinedArt;

      const finalOut = [];
      let lIdx = 0;
      for (let i = 0; i < combinedArt.length; i++) {
        finalOut.push(combinedArt[i]);
        if ((i + 1) % 10 === 0 && lIdx < litList.length) {
          finalOut.push(litList[lIdx++]);
        }
      }
      while (lIdx < litList.length) {
        finalOut.push(litList[lIdx++]);
      }
      return finalOut;
    }

    async function harvestStream(stream) {
      try {
        if (stream.api === 'cma') {
          const hlParam = stream.highlightOnly ? '&highlight=1' : '';
          const url = `https://openaccess-api.clevelandart.org/api/artworks/?cc0&has_image=1${hlParam}&limit=${stream.limit}&fields=id,accession_number,share_license_status,is_highlight,current_location,did_you_know,citations,exhibitions,title,creation_date,creation_date_earliest,creators,culture,technique,department,type,url,images,description&q=${encodeURIComponent(stream.q)}`;
          const res = await fetch(url);
          if (!res.ok) return [];
          const data = await res.json();
          return (data.data || []).map(r => parseCmaRecord(r, stream)).filter(Boolean);
        } else if (stream.api === 'aic') {
          const boostParam = stream.boostedOnly ? '&query[term][is_boosted]=true' : '';
          const qParam = stream.q ? `&q=${encodeURIComponent(stream.q)}` : '';
          const url = `https://api.artic.edu/api/v1/artworks/search?query[term][is_public_domain]=true${boostParam}&limit=${stream.limit}&fields=id,title,artist_title,date_display,date_start,place_of_origin,medium_display,image_id,classification_title,style_title,short_description,is_boosted,boost_rank,is_on_view,has_not_been_viewed_much${qParam}`;
          const res = await fetch(url);
          if (!res.ok) return [];
          const data = await res.json();
          return (data.data || []).map(r => parseAicRecord(r, stream)).filter(Boolean);
        } else if (stream.api === 'smk') {
          const url = `https://api.smk.dk/api/v1/art/search/?keys=${encodeURIComponent(stream.q)}&filters=[has_image:true],[public_domain:true]&offset=0&rows=${stream.limit}&lang=en`;
          const res = await fetch(url);
          if (!res.ok) return [];
          const data = await res.json();
          return (data.items || []).map(r => parseSmkRecord(r, stream)).filter(Boolean);
        } else if (stream.api === 'poetrydb') {
          const res = await fetch(stream.url);
          if (!res.ok) return [];
          const data = await res.json();
          if (!Array.isArray(data)) return [];
          return data.slice(0, 8).map((p, idx) => parsePoetryDbRecord(p, stream, idx)).filter(Boolean);
        }
      } catch (err) {
        return [];
      }
      return [];
    }

      return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function colorDist(c1, c2) {
      const dr = c1[0] - c2[0], dg = c1[1] - c2[1], db = c1[2] - c2[2];
      return Math.sqrt(dr * dr + dg * dg + db * db);
    }

    function sampleImagePalette(imgEl, fallbackColors) {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 56;
        canvas.height = 56;
        ctx.drawImage(imgEl, 0, 0, 56, 56);
        const data = ctx.getImageData(0, 0, 56, 56).data;
        const pixels = [];
        for (let i = 0; i < data.length; i += 8) {
          const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
          if (a < 160) continue;
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          const sat = max === 0 ? 0 : (max - min) / max;
          pixels.push({ rgb: [r, g, b], lum, sat });
        }
        if (pixels.length < 20) return;

        const byLum = [...pixels].sort((a, b) => a.lum - b.lum);
        const shadow = byLum[Math.floor(byLum.length * 0.06)].rgb;
        const ground = byLum[Math.floor(byLum.length * 0.90)].rgb;
        const chosen = [shadow];

        const candidates = [...pixels].sort((a, b) => b.sat - a.sat);
        for (const cand of candidates) {
          if (chosen.length >= 4) break;
          const minDist = Math.min(
            ...chosen.map(c => colorDist(cand.rgb, c)),
            colorDist(cand.rgb, ground)
          );
          if (minDist >= 44) {
            chosen.push(cand.rgb);
          }
        }

        const quantiles = [0.25, 0.50, 0.72];
        for (const q of quantiles) {
          if (chosen.length >= 4) break;
          chosen.push(byLum[Math.floor(byLum.length * q)].rgb);
        }
        chosen.push(ground);

        renderPaletteDots(chosen.slice(0, 5).map(c => rgbToHex(c[0], c[1], c[2])));
      } catch (e) {
        renderPaletteDots(fallbackColors);
      }
    }
