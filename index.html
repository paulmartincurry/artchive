    async function fetchPoetryDbOnDemand(cleanQ) {
      const results = [];
      if (!cleanQ || cleanQ.length < 3) return results;
      const baseStream = { subj: 'Solitude', emo: 'Silence', date: 'Archive Verse', era: '19th Century' };
      const endpoints = [
        `https://poetrydb.org/author/${encodeURIComponent(cleanQ)}`,
        `https://poetrydb.org/title/${encodeURIComponent(cleanQ)}`
      ];
      await Promise.all(endpoints.map(async (url) => {
        try {
          const res = await fetch(url);
          if (!res.ok) return;
          const data = await res.json();
          if (!Array.isArray(data)) return;
          data.slice(0, 6).forEach((p, idx) => {
            const parsed = parsePoetryDbRecord(p, baseStream, Math.floor(Math.random() * 900) + idx);
            if (parsed) {
              parsed.id = `PDB-LIVE-${normalizeKey(parsed.artist).slice(0, 8)}-${normalizeKey(parsed.title).slice(0, 12)}`;
              parsed.museum = 'PoetryDB · Live Open Canon';
              parsed.isLiveApi = true;
              results.push(parsed);
            }
          });
        } catch (e) {}
      }));
      return results;
    }

    async function searchOpenMuseumsOnDemand(rawQuery) {
      const q = (rawQuery || state.query || '').trim();
      if (!q) return;
      const normQ = normalizeKey(q);
      if (!state.liveFetchedQueries) state.liveFetchedQueries = {};
      if (state.liveFetchedQueries[normQ] && (state.liveFetchedQueries[normQ].loading || state.liveFetchedQueries[normQ].done)) {
        return;
      }

      // Strip pure format helper words ('poems', 'art', 'paintings') when querying museum APIs
      const cleanedApiQ = q
        .replace(/\b(poems?|poetry|verses?|sonnets?|artworks?|paintings?)\b/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim() || q;
      const wantsLitOnly = /\b(poems?|poetry|verses?|sonnets?|chapbooks?|haiku)\b/i.test(q) && !/\b(paintings?|sculptures?|prints?)\b/i.test(q);
      const wantsArtOnly = /\b(paintings?|sculptures?|woodcuts?|etchings?|ceramics?|bronzes?)\b/i.test(q);

      state.liveFetchedQueries[normQ] = { loading: true, done: false, added: 0 };
      syncLiveSearchPillUI();

      try {
        const tasks = [];
        if (!wantsLitOnly) {
          tasks.push(harvestStream({ api: 'cma', q: cleanedApiQ, limit: 16, subj: 'Gaze', emo: 'Sublime' }));
          tasks.push(harvestStream({ api: 'aic', q: cleanedApiQ, limit: 16, subj: 'Gaze', emo: 'Sublime' }));
          tasks.push(harvestStream({ api: 'smk', q: cleanedApiQ, limit: 12, subj: 'Gaze', emo: 'Sublime' }));
        }
        if (!wantsArtOnly) {
          tasks.push(fetchPoetryDbOnDemand(cleanedApiQ));
        }

        const batches = await Promise.all(tasks);
        const existingKeys = new Set(WORKS.map(w => `${normalizeKey(w.title || '')}|${normalizeKey(w.artist || '')}`));
        const existingIds = new Set(WORKS.map(w => w.id));
        let addedCount = 0;

        batches.flat().forEach(item => {
          if (!item || !item.id) return;
          const k = `${normalizeKey(item.title || '')}|${normalizeKey(item.artist || '')}`;
          if (existingIds.has(item.id) || existingKeys.has(k)) return;
          existingIds.add(item.id);
          existingKeys.add(k);
          item.isLiveApi = true;
          // Ensure search engine indexes the query clue so multi-term queries surface live hits cleanly
          item._liveQueryTag = q;
          item.note = item.note ? `${item.note} [Live Open-Access]` : `Pulled live on demand from ${item.museum || 'Open Museum API'} for “${q}”.`;
          state.sessionLiveWorks.push(item);
          addedCount++;
        });

        state.liveFetchedQueries[normQ] = { loading: false, done: true, added: addedCount };
        rebuildActiveWorksPool();
        filterWorks(false);
      } catch (err) {
        state.liveFetchedQueries[normQ] = { loading: false, done: true, added: 0 };
        syncLiveSearchPillUI();
      }
    }

    function deriveLightboxMuseumQuery(w) {
      if (!w) return { primary: 'masterpiece', label: 'Load museum cousins ↗' };
      const artist = (w.artist || '').trim();
      const genericCreatorRe = /unknown|anonymous|workshop|kiln|foundry|master|caster|dynasty|school|tradition|period/i;
      if (artist && !genericCreatorRe.test(artist)) {
        const cleanArtist = artist.split('(')[0].trim();
        const shortName = cleanArtist.split(/\s+/).slice(-1)[0];
        return {
          primary: cleanArtist,
          fallback: `${w.macroRegion || ''} ${w.subjectShort || ''}`.trim(),
          label: `More by ${shortName.length > 2 ? cleanArtist : artist} & peers ↗`
        };
      }
      const regWord = (w.region || w.macroRegion || '').split(/[(),/]/)[0].trim();
      const medWord = (w.medium || '').split(/\s+/).slice(0, 2).join(' ');
      const combo = `${regWord} ${medWord}`.trim() || w.subjectShort || 'ancient art';
      return {
        primary: combo,
        fallback: regWord || w.subjectShort || 'sculpture',
        label: `More ${regWord || 'Open-Museum'} works ↗`
      };
    }

    async function fetchLightboxLiveCousinsForActive() {
      const w = state.currentList[state.activeWorkIndex];

      const statusEl = document.getElementById('liveCousinsStatus');
      if (!w || !btn || !statusEl) return;

      statusEl.textContent = 'Checking Cleveland Museum of Art, Art Institute of Chicago & SMK Denmark…';

      try {
        const tasks = [];

          tasks.push(fetchPoetryDbOnDemand(qInfo.primary));
          tasks.push(harvestStream({ api: 'cma', q: w.subjectShort || 'night', limit: 6, subj: w.subjectShort, emo: w.emotionShort }));
          tasks.push(harvestStream({ api: 'aic', q: w.subjectShort || 'night', limit: 6, subj: w.subjectShort, emo: w.emotionShort }));
        } else {
          tasks.push(harvestStream({ api: 'cma', q: qInfo.primary, limit: 8, subj: w.subjectShort, emo: w.emotionShort }));
          tasks.push(harvestStream({ api: 'aic', q: qInfo.primary, limit: 8, subj: w.subjectShort, emo: w.emotionShort }));
          tasks.push(harvestStream({ api: 'smk', q: qInfo.primary, limit: 6, subj: w.subjectShort, emo: w.emotionShort }));
        }

        let candidates = (await Promise.all(tasks)).flat();

        // Fallback to regional/motif query if specific artist had < 3 open-access hits
        if (candidates.length < 3 && qInfo.fallback) {
          const fb = await Promise.all([
            harvestStream({ api: 'cma', q: qInfo.fallback, limit: 6, subj: w.subjectShort, emo: w.emotionShort }),
            harvestStream({ api: 'aic', q: qInfo.fallback, limit: 6, subj: w.subjectShort, emo: w.emotionShort })
          ]);
          candidates = candidates.concat(fb.flat());
        }

        const seen = new Set([
          w.id,
          `${normalizeKey(w.title || '')}|${normalizeKey(w.artist || '')}`

        for (const c of candidates) {
          if (!c || !c.id) continue;
          const k = `${normalizeKey(c.title || '')}|${normalizeKey(c.artist || '')}`;
          if (seen.has(c.id) || seen.has(k)) continue;
          seen.add(c.id);

          uniqueCousins.push(c);
          if (uniqueCousins.length >= 6) break;

        if (!state.lightboxLiveCache) state.lightboxLiveCache = {};
        state.lightboxLiveCache[w.id] = uniqueCousins;

        btn.textContent = qInfo.label;
        statusEl.textContent = 'Museum connection unavailable right now.';
      }
    }

    function syncSavedLiveWorkPersistence(work) {

  // ---- tool row ----
  function facetLabel(f) {

  }

  // ---- the timeline: the collection as a histogram; drag across it to choose a span ----
  const NB = 90;
  function drawEra() {
    const base = countBase('era'), bins = new Array(NB).fill(0);
    base.forEach(w => { if (typeof w.yearNum === 'number') bins[Math.min(NB - 1, Math.floor(yToT(w.yearNum) * NB))]++; });
    const mx = Math.max(1, ...bins), W = 556, H = 92;

    }).join('');
    const ticks = [[-40000, 'Deep past'], [0, 'AD 1'], [1000, '1000'], [1400, '1400'], [1600, '1600'], [1800, '1800'], [1900, '1900'], [2030, 'Now']].map(([y, l]) =>
      `<span style="left:${(yToT(y) * 100).toFixed(2)}%">${l}</span>`).join('');

  function paintSpan(base) {
    const band = pop.querySelector('.pv-tl-band'), cnt = pop.querySelector('[data-pv-count]');

      const b = +r.dataset.b, mid = (b + 0.5) / NB; r.classList.toggle('is-on', !!span && mid >= t0 - 0.5 / NB && mid <= t1 + 0.5 / NB);
    });
    if (band) { band.hidden = !span; if (span) { band.style.left = (t0 * 100) + '%'; band.style.width = Math.max(0.4, (t1 - t0) * 100) + '%'; } }

  }
  let eraT = 0;
  function bindEra(base) {
    const box = pop.querySelector('.pv-tl'); if (!box) return;
    let a = null, moved = false;
    const tAt = e => { const r = box.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };

      let lo = Math.min(ta, tb), hi = Math.max(ta, tb);

  // ---- the map: click regions on and off, as many as you like ----

  // ---- Show: All / Art / Writing ----
  function syncShow() {

  // ---- the read-back line: what you asked for, and how many works it found ----
  const bar = document.getElementById('wallControlsBar');
  const read = document.createElement('div'); read.className = 'pv-read'; read.id = 'pvRead';
  if (bar) bar.insertBefore(read, bar.firstChild);
  function drawRead() {

    if (shade) parts.push(['shade', '', shade.label]);

      `<span class="pv-count">— ${n.toLocaleString()} ${n === 1 ? 'work' : 'works'}</span>` +

  // Boards travel by link (Paul, 23 Nov 2026). Boards live in each visitor's own browser; a board link carries its name and

  // "Keep this board" copies it into the visitor's own boards.
  const packId = id => id.startsWith('VAULT-') ? 'v' + id.slice(6) : id.startsWith('LIT-') ? 'l' + id.slice(4) : '';
  const unpackId = t => t[0] === 'v' ? 'VAULT-' + t.slice(1) : t[0] === 'l' ? 'LIT-' + t.slice(1) : '';

  // Saving (Paul, 23 Nov 2026): one Save button. A tap saves the work; a small card then offers the boards, a new board,
  // or taking it back out. The old board menu under the label is gone.
  (function saveCard() {
    const btn = document.getElementById('lbSaveBtn'); if (!btn) return;
    const host = btn.parentNode; host.style.position = 'relative';
    const card = document.createElement('div'); card.className = 'pv-savecard'; card.hidden = true; host.appendChild(card);
    const cur = () => state.currentList[state.activeWorkIndex];
    const label = () => { const w = cur(); const on = !!(w && state.savedIds.has(w.id)); btn.textContent = on ? 'Saved' : 'Save'; btn.classList.toggle('active', on); };
    const after = () => { if (typeof persistStacks === 'function') persistStacks(); if (typeof updateSavedCounter === 'function') updateSavedCounter(); if (state.onlySaved) filterWorks(true); };
    function draw() {
      const w = cur(); if (!w) return;
      const names = Object.keys(state.stacks || {});
      card.innerHTML = `<div class="pv-sc-h">Saved</div>` +
        (names.length ? `<div class="pv-sc-sub">Add to a board</div>` : '') +
        names.map(n => `<button type="button" class="pv-sc-b${(state.stacks[n] || []).includes(w.id) ? ' on' : ''}" data-b="${esc(n)}">${esc(n)}</button>`).join('') +
        `<form class="pv-sc-new"><input type="text" maxlength="28" placeholder="New board" aria-label="New board name"></form>` +
        `<button type="button" class="pv-sc-x" data-unsave="1">Remove from saved</button>`;
    }
    function open() { draw(); card.hidden = false; }
    function close() { card.hidden = true; }
    btn.addEventListener('click', (e) => {
      const w = cur(); if (!w) return;
      if (state.savedIds.has(w.id)) { e.stopImmediatePropagation(); e.preventDefault(); card.hidden ? open() : close(); return; }
      setTimeout(() => { label(); open(); }, 0);   // the original handler saves it first
    }, true);
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      const w = cur(); if (!w) return;
      const b = e.target.closest('[data-b]');
      if (b) {
        const n = b.dataset.b, list = state.stacks[n] || (state.stacks[n] = []);
        const i = list.indexOf(w.id); if (i >= 0) list.splice(i, 1); else list.unshift(w.id);
        after(); draw(); return;
      }
      if (e.target.closest('[data-unsave]')) {
        state.savedIds.delete(w.id);
        Object.keys(state.stacks || {}).forEach(k => { state.stacks[k] = (state.stacks[k] || []).filter(id => id !== w.id); });

    });
    document.addEventListener('click', (e) => { if (!card.hidden && !card.contains(e.target) && e.target !== btn) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !card.hidden) { e.stopPropagation(); close(); } }, true);

    img.style.transform = s === 1 ? '' : `translate(${tx}px, ${ty}px) scale(${s})`;
    wrap.classList.toggle('pv-zoomed', s > 1);
    if (s > 1.6) loadBig(s > 3.2 ? 2 : 1);
  }
  function zoomAt(ns, cx, cy, ease) {
    ns = Math.max(1, Math.min(MAX, ns));
    const r = img.getBoundingClientRect();
    // the point under the cursor stays under the cursor
    const ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2);
    const k = ns / s;
    tx = tx + ox - ox * k; ty = ty + oy - oy * k;
    s = ns; apply(ease);
  }
  function reset(ease) { s = 1; tx = 0; ty = 0; apply(ease); }
  function loadBig(level) {
    const w = cur(); if (!w) return;
    const key = w.id + ':' + level; if (hiTried && hiTried >= key) return;
    hiTried = key;
    const big = bigSrc(w, level); if (!big || big === img.src) return;
    const pre = new Image();
    pre.onload = () => {
      if (cur() !== w || pre.naturalWidth <= img.naturalWidth) return;
      const bw = img.offsetWidth, bh = img.offsetHeight;
      img.style.width = bw + 'px'; img.style.height = bh + 'px';   // same box, sharper file
      const keep = img.onload; img.onload = null; img.src = big; setTimeout(() => { img.onload = keep; }, 0);
    };
    pre.src = big;
  }
  function showHint() {
    if (hintShown || matchMedia('(hover: none)').matches) return;
    try { if (localStorage.getItem('pvZoomHint')) { hintShown = true; return; } } catch (e) {}
    hint = hint || Object.assign(document.createElement('div'), { className: 'pv-zoomhint', textContent: 'Pinch or double-click to zoom' });
    wrap.appendChild(hint); requestAnimationFrame(() => hint.classList.add('on'));
    setTimeout(() => hint && hint.classList.remove('on'), 2600);
    hintShown = true; try { localStorage.setItem('pvZoomHint', '1'); } catch (e) {}
  }
  // a new work starts unzoomed, in its own box
  const o = openLightbox;
  openLightbox = function () {
    s = 1; tx = 0; ty = 0; hiTried = null;
    img.style.transform = ''; img.style.width = ''; img.style.height = ''; img.classList.remove('pv-zt', 'pv-zease'); wrap.classList.remove('pv-zoomed');
    const r = o.apply(this, arguments);
    wrap.classList.toggle('pv-zoomable', isArt());
    if (isArt()) setTimeout(showHint, 900);
    return r;
  };
  // trackpad pinch arrives as a wheel event with ctrlKey; two-finger scroll pans while zoomed
  wrap.addEventListener('wheel', (e) => {
    if (!isArt()) return;
    if (e.ctrlKey) { e.preventDefault(); e.stopImmediatePropagation(); zoomAt(s * Math.exp(-e.deltaY * 0.012), e.clientX, e.clientY); return; }
    if (s > 1) { e.preventDefault(); e.stopImmediatePropagation(); tx -= e.deltaX; ty -= e.deltaY; apply(); }
  }, { passive: false, capture: true });
  // Safari's own pinch events
  let gs = 1;
  wrap.addEventListener('gesturestart', (e) => { if (!isArt()) return; e.preventDefault(); gs = s; }, { capture: true });
  wrap.addEventListener('gesturechange', (e) => { if (!isArt()) return; e.preventDefault(); zoomAt(gs * e.scale, e.clientX, e.clientY); }, { capture: true });
  wrap.addEventListener('gestureend', (e) => { if (isArt()) e.preventDefault(); }, { capture: true });
  // drag to look around
  let drag = null;
  wrap.addEventListener('pointerdown', (e) => {
    if (!isArt() || s <= 1 || e.pointerType === 'touch') return;
    e.preventDefault(); e.stopImmediatePropagation();
    drag = { x: e.clientX - tx, y: e.clientY - ty, moved: false }; wrap.classList.add('pv-panning');
  }, { capture: true });
  window.addEventListener('pointermove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; drag.moved = true; apply(); });
  window.addEventListener('pointerup', () => { if (drag) { wrap.classList.remove('pv-panning'); setTimeout(() => { drag = null; }, 0); } });
  wrap.addEventListener('click', (e) => { if (drag && drag.moved) { e.stopImmediatePropagation(); e.preventDefault(); } }, { capture: true });
  wrap.addEventListener('dblclick', (e) => {
    if (!isArt()) return; e.preventDefault(); e.stopImmediatePropagation();
    if (s > 1) reset(true); else zoomAt(2.5, e.clientX, e.clientY, true);
  }, { capture: true });
  // touch: two fingers pinch, one finger pans while zoomed, double-tap jumps
  let t0 = null, lastTap = 0;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  wrap.addEventListener('touchstart', (e) => {
    if (!isArt()) return;
    if (e.touches.length === 2) { const [a, b] = e.touches; t0 = { d: dist(a, b), s, mx: (a.clientX + b.clientX) / 2, my: (a.clientY + b.clientY) / 2, pinch: true }; e.preventDefault(); }
    else if (e.touches.length === 1) {
      const now = Date.now(), t = e.touches[0];
      if (now - lastTap < 300) { e.preventDefault(); if (s > 1) reset(true); else zoomAt(2.5, t.clientX, t.clientY, true); lastTap = 0; t0 = null; return; }
      lastTap = now;
      if (s > 1) { t0 = { x: t.clientX - tx, y: t.clientY - ty }; e.preventDefault(); }
    }
  }, { passive: false, capture: true });
  wrap.addEventListener('touchmove', (e) => {
    if (!t0 || !isArt()) return; e.preventDefault(); e.stopImmediatePropagation();
    if (t0.pinch && e.touches.length === 2) { const [a, b] = e.touches; zoomAt(t0.s * dist(a, b) / t0.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    else if (!t0.pinch && e.touches.length === 1) { tx = e.touches[0].clientX - t0.x; ty = e.touches[0].clientY - t0.y; apply(); }
  }, { passive: false, capture: true });
  wrap.addEventListener('touchend', (e) => { if (e.touches.length === 0) t0 = null; }, { capture: true });
  // Esc steps out of the zoom before it closes the work; the arrows still page to the next work, which starts unzoomed
  document.addEventListener('keydown', (e) => {
    if (!isArt() || s <= 1) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); reset(true); }
    else if (e.key === '0') { reset(true); }
  }, true);
  window.addEventListener('resize', () => { if (s > 1) apply(); });
  window.pvZoom = { at: zoomAt, reset, get: () => ({ s, tx, ty }) };
  wrap.classList.toggle('pv-zoomable', isArt());
})();

// Phones get the system share sheet for an open work: its own page, which previews properly (23 Nov 2026).
(function nativeShare() {
  const btn = document.getElementById('lbShareBtn');
  if (!btn || !navigator.share || !matchMedia('(hover: none)').matches) return;
  document.documentElement.classList.add('pv-can-share');
  btn.textContent = 'Share';
  btn.addEventListener('click', (e) => {
    const w = state.currentList[state.activeWorkIndex]; if (!w || !w.slug) return;
    e.stopImmediatePropagation(); e.preventDefault();
    const url = location.href.split('#')[0].split('?')[0].replace(/index\.html$/, '') + 'w/' + w.slug + '.html';
    navigator.share({ title: [w.title, w.artist].filter(Boolean).join(' — '), url }).catch(() => {});
  }, true);
})();
</script>
